# prokopii.ru — лендинг prokop.
# Разворачивает локальная сторона. Выкатка обязана быть на ревизию, иначе Docker
# возьмёт слой git clone из кэша и в образ уедет старый код:
#   SITE_REV=$(git ls-remote https://github.com/yaugust939/prokop refs/heads/site | cut -f1) \
#     docker compose up -d --build
# Отладочный порт — строго 127.0.0.1:8094 (8093 занят артелью, 8095 и 8096 тоже заняты).

services:
  prokopii-site:
    build:
      context: .
      args:
        SITE_REF: site
        # Без переменной сборка остановится с объяснением — это намеренно.
        # Кавычки обязательны: двоеточие внутри ${VAR:?текст} YAML читает как
        # новое отображение и падает на разборе файла.
        SITE_REV: "${SITE_REV:?не задан SITE_REV — см. комментарий выше}"
    image: prokopii-site:latest
    container_name: prokopii-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8094:80"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
