# Заголовки безопасности лендинга prokop.
# Отдельный файл, потому что в nginx add_header наследуется сверху вниз
# ТОЛЬКО если на текущем уровне нет своих add_header. Любой location со своим
# Cache-Control молча отменяет заголовки уровня server — поэтому каждый такой
# location включает этот файл явно. Проверять отдачу: curl -I https://<домен>/

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
