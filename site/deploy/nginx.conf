# prokopii.ru — статика лендинга prokop. Слушает 80, за Traefik.
# Порт наружу не публикуется: см. docker-compose.yml (только 127.0.0.1:8094 для отладки).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Точка здоровья: отвечает константой, файл не читается.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok";
    }

    # Шрифты: 180 дней. ^~ — чтобы регулярка статики ниже не перехватила.
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=15552000" always;
        try_files $uri =404;
    }

    # Статика: месяц.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|avif|ico|woff2?|txt|xml)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Чистые URL, страницы не кэшируются намертво.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        add_header Cache-Control "public, must-revalidate" always;
    }

    # Запрет точек, кроме /.well-known.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
