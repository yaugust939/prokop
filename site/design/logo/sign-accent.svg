<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 13" width="13" height="13" role="img" aria-labelledby="t">
<title id="t">Прокопий — знак: обвес из 12 модулей и пиксельная «П» в центре</title>
<!-- Знак «Кольцо и инициал». Сетка 13×13 модулей, центр 6.5,6.5.
     Обвес: 12 модулей радиуса 5, набор замкнут под поворотами и отражениями.
     Ядро: «П» — 5×5 модулей, 13 заливок (перекладина 5, две стойки по 4).
     Зазор до кольца ровно один модуль по кругу. -->
<defs>
  <g id="m"><rect x="-0.5" y="-0.5" width="1" height="1" rx="0.14"/></g>
</defs>

<!-- обвес -->
<g fill="#C8873C">
  <use href="#m" x="11.5" y="6.5"/>
  <use href="#m" x="10.5" y="9.5"/>
  <use href="#m" x="9.5"  y="10.5"/>
  <use href="#m" x="6.5"  y="11.5"/>
  <use href="#m" x="3.5"  y="10.5"/>
  <use href="#m" x="2.5"  y="9.5"/>
  <use href="#m" x="1.5"  y="6.5"/>
  <use href="#m" x="2.5"  y="3.5"/>
  <use href="#m" x="3.5"  y="2.5"/>
  <use href="#m" x="6.5"  y="1.5"/>
  <use href="#m" x="9.5"  y="2.5"/>
  <use href="#m" x="10.5" y="3.5"/>
</g>

<!-- ядро: «П» -->
<g fill="#D8382B">
  <use href="#m" x="4.5" y="4.5"/>
  <use href="#m" x="5.5" y="4.5"/>
  <use href="#m" x="6.5" y="4.5"/>
  <use href="#m" x="7.5" y="4.5"/>
  <use href="#m" x="8.5" y="4.5"/>
  <use href="#m" x="4.5" y="5.5"/>
  <use href="#m" x="8.5" y="5.5"/>
  <use href="#m" x="4.5" y="6.5"/>
  <use href="#m" x="8.5" y="6.5"/>
  <use href="#m" x="4.5" y="7.5"/>
  <use href="#m" x="8.5" y="7.5"/>
  <use href="#m" x="4.5" y="8.5"/>
  <use href="#m" x="8.5" y="8.5"/>
</g>
</svg>
