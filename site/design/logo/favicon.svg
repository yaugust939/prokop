<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-labelledby="t">
<title id="t">Прокопий — favicon</title>
<!-- Favicon: поле киноварью, «П» бумагой. Кольцо убрано — на 16px оно сливается,
     остаётся инициал: модуль 16/9, центр 8,8, те же 13 заливок. -->
<defs>
  <g id="f"><rect x="-0.889" y="-0.889" width="1.778" height="1.778" rx="0.3"/></g>
</defs>
<rect width="16" height="16" rx="3.2" fill="#D8382B"/>
<g fill="#F4EDDD">
  <!-- перекладина -->
  <use href="#f" x="4.4444" y="4.4444"/>
  <use href="#f" x="6.2222" y="4.4444"/>
  <use href="#f" x="8"      y="4.4444"/>
  <use href="#f" x="9.7778" y="4.4444"/>
  <use href="#f" x="11.5556" y="4.4444"/>
  <!-- левая стойка -->
  <use href="#f" x="4.4444" y="6.2222"/>
  <use href="#f" x="4.4444" y="8"/>
  <use href="#f" x="4.4444" y="9.7778"/>
  <use href="#f" x="4.4444" y="11.5556"/>
  <!-- правая стойка -->
  <use href="#f" x="11.5556" y="6.2222"/>
  <use href="#f" x="11.5556" y="8"/>
  <use href="#f" x="11.5556" y="9.7778"/>
  <use href="#f" x="11.5556" y="11.5556"/>
</g>
</svg>
