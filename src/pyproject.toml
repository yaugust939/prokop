[project]
name = "prokop"
version = "0.1.0"
description = "prokop — ядро универсального агента (по спецификации OpenSpec)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prokop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
