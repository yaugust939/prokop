name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ядро обязано быть платформенно-нейтральным: гоняем все три ОС,
        # иначе Windows-ветки (taskkill, CREATE_NO_WINDOW, фолбэк блокировки)
        # не покрыты вообще.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e src
          pip install pytest

      - name: Run tests
        run: python -m pytest src/tests -q

  # Проверка, что в коде не осталось личных абсолютных путей и платформенных
  # хардкодов вне известных точек (см. docs/PLATFORM_NOTES.md).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No personal absolute paths
        shell: bash
        run: |
          set -euo pipefail
          if grep -rInE 'C:\\\\Users\\\\[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+/' src/prokop src/tests; then
            echo "::error::найден личный абсолютный путь в коде ядра"
            exit 1
          fi
          echo "OK: личных путей нет"
